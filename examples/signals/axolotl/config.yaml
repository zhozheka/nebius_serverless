base_model: Qwen/Qwen2.5-0.5B

load_in_4bit: true
adapter: qlora

datasets:
  - path: Salesforce/wikitext
    name: wikitext-2-raw-v1
    split: "train[:2000]"
    type: completion
    field: text

sequence_len: 128
micro_batch_size: 1
gradient_accumulation_steps: 1

learning_rate: 2e-4
max_steps: 3000  # the cookbook runs 30; ~7 min on an H100, room to preempt
val_set_size: 0
logging_steps: 5

# Axolotl writes to local disk. The bucket mount is not a full POSIX
# filesystem, so checkpoints are copied to it by checkpoint_plugin.
output_dir: /workspace/output
dataset_prepared_path: /workspace/prepared

# Checkpoint and resume (not in the cookbook config).
save_strategy: steps
save_steps: 200
save_total_limit: 2
auto_resume_from_checkpoints: true  # resume from output_dir/checkpoint-N
plugins:
  - checkpoint_plugin.CheckpointPlugin  # save on SIGTERM, copy to bucket

# MLflow. The tracking URI and credentials come from the job's environment
# (MLFLOW_TRACKING_URI, MLFLOW_TRACKING_USERNAME, MLFLOW_TRACKING_PASSWORD).
# resumable_axolotl.py makes every attempt log to the same run.
mlflow_experiment_name: repeatable-axolotl

lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
